name: Guillaume
surname: ASTRUC
short_description: PhD student in Computer Vision working on Self-supervised Learning and Geospatial data
content: I am pursuing a PhD at [Imagine Institute](https://imagine-lab.enpc.fr/) from École des Ponts ParisTech (ENPC), [Lastig laboratory](https://www.umr-lastig.fr/) at National Institute of Geographic and Forest Information (IGN), and French National Centre for Space Studies ([CNES](https://cnes.fr)) under the supervision of [Loic Landrieu](https://loiclandrieu.com/), [Nicolas Gonthier](https://ngonthier.github.io/), and [Clement Mallet](https://www.umr-lastig.fr/clement-mallet/). My research focuses on **representation learning for heterogeneous geospatial data**. I develop foundation models for Earth observation that adapt to any sensor, resolution, and scale, with a parallel interest in visual geolocation. **I will defend my PhD in March 2027 and am looking for new positions.**
